name: Documentation

on:
  push:
    branches:
      - main # update to match your development branch (master, main, dev, trunk, ...)
    tags: '*'
  pull_request:

jobs:
  build:
    # These permissions are needed to:
    # - Deploy the documentation: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        #shell: julia --color=yes --project=docs {0}
        #run: julia --color=yes --project=docs/ -e 'using Pkg; Pkg.add(PackageSpec(name="MbedTLS_jll")); Pkg.add(PackageSpec(name="LibGit2_jll")); Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
        #run: julia --color=yes --project=docs/ -e 'using Pkg; Pkg.add(["MbedTLS_jll", "LibGit2_jll", "MbedTLS_jll"]);Pkg.instantiate()'
        #run: julia --color=yes --project=docs/ -e 'using Pkg; Pkg.instantiate()'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
        #  Pkg.add(PackageSpec(name="LibGit2_jll"))
        #  Pkg.develop(PackageSpec(path=pwd()))
        #  Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build documentation
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
          julia --project=docs/ docs/make.jl        
        #- name: Build and deploy
        #  run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
